<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="25%" cy="15%" r="95%">
      <stop offset="0" stop-color="#343a6b"/>
      <stop offset="0.6" stop-color="#14182b"/>
    </radialGradient>
    <clipPath id="front"><rect x="150" y="150" width="260" height="250" rx="34"/></clipPath>
  </defs>
  <!-- Browser tab: rounded, so it reads as an app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(1.2) translate(-241 -246)">
  <!-- Back calendar, tilted: the one you already said yes to -->
  <g transform="rotate(-12 220 250)">
    <rect x="92" y="112" width="250" height="240" rx="32" fill="#e8e4f7"/>
    <path d="M92 144a32 32 0 0 1 32-32h186a32 32 0 0 1 32 32v28H92z" fill="#8f86d9"/>
  </g>

  <!-- Front calendar -->
  <g>
    <rect x="150" y="150" width="260" height="250" rx="34" fill="#ffffff"/>
    <g clip-path="url(#front)">
      <rect x="150" y="150" width="260" height="62" fill="#ff5b5b"/>
    </g>
    <rect x="198" y="128" width="20" height="46" rx="10" fill="#1d2033"/>
    <rect x="342" y="128" width="20" height="46" rx="10" fill="#1d2033"/>
    <!-- Two meetings in the same slot -->
    <rect x="182" y="244" width="150" height="104" rx="16" fill="#5b8cff"/>
    <rect x="236" y="276" width="146" height="94" rx="16" fill="#ff8a5b" opacity="0.92"/>
    <rect x="236" y="276" width="96" height="72" rx="0" fill="#c9547f" opacity="0.55"/>
  </g>
  </g>
</svg>
